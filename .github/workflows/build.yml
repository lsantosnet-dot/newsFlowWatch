name: Gerar APK do relógio

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes e APK
        env:
          # Variable do repositório (Settings > Secrets and variables > Actions > Variables).
          # Se estiver vazia, o app pede o ID na tela de Configuração do relógio.
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: newsflow-watch-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
